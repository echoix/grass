name: OSGeo4W setup extraction benchmark

on:
  push:
    branches:
      - claude/busy-dirac-47uztw
    paths:
      - .github/workflows/osgeo4w-setup-bench.yml
      - .github/osgeo4w-setup-bench/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the real setup (three variants)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/osgeo4w-setup-bench

      - name: Check out the real OSGeo4W setup sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jef-n/OSGeo4W
          ref: 2a4fef009d86d52b35e25c43954d817cfec79e8e
          path: osgeo4w
          persist-credentials: false
          sparse-checkout: src/setup

      - name: Install flex and bison
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed bison flex"

      - name: Build
        shell: pwsh
        run: .github/osgeo4w-setup-bench/build_setup.ps1 -Source "$env:GITHUB_WORKSPACE\osgeo4w" -Work C:\bench

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-variants
          path: C:\bench\setup\*.exe
          retention-days: 3
          if-no-files-found: error

  bench:
    name: ${{ matrix.package }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package:
          - python3-notebook
          - python3-jupyterlab
          - python3-core
          - grass-dev
          - qgis-ltr-pdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/osgeo4w-setup-bench

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: setup-variants
          path: C:\bench\setup

      - name: Download the package into a local mirror
        shell: pwsh
        run: python .github/osgeo4w-setup-bench/make_mirror.py C:\bench\mirror ${{ matrix.package }}

      - name: Run the real setup variants
        shell: pwsh
        run: .github/osgeo4w-setup-bench/run_setup.ps1 -Work C:\bench -Packages ${{ matrix.package }}

      - name: 7-Zip on the same package
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .github/osgeo4w-setup-bench/sevenzip.ps1 -Work C:\bench
