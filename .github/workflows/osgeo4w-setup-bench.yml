name: OSGeo4W setup extraction benchmark

on:
  push:
    branches:
      - claude/busy-dirac-47uztw
    paths:
      - .github/workflows/osgeo4w-setup-bench.yml
      - .github/osgeo4w-setup-bench/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/osgeo4w-setup-bench

      - name: Build harness
        id: build
        shell: cmd
        run: .github\osgeo4w-setup-bench\build.bat C:\bench

      - name: Download packages
        id: download
        shell: pwsh
        run: python .github/osgeo4w-setup-bench/select_pkgs.py C:\bench\pkgs

      - name: Benchmark python3-notebook
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.download.outcome == 'success' }}
        shell: pwsh
        run: .github/osgeo4w-setup-bench/run.ps1 -Work C:\bench -Package python3-notebook

      - name: Benchmark python3-jupyterlab
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.download.outcome == 'success' }}
        shell: pwsh
        run: .github/osgeo4w-setup-bench/run.ps1 -Work C:\bench -Package python3-jupyterlab

      - name: Benchmark python3-core
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.download.outcome == 'success' }}
        shell: pwsh
        run: .github/osgeo4w-setup-bench/run.ps1 -Work C:\bench -Package python3-core

      - name: Benchmark grass-dev
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.download.outcome == 'success' }}
        shell: pwsh
        run: .github/osgeo4w-setup-bench/run.ps1 -Work C:\bench -Package grass-dev

      - name: Benchmark qgis-ltr-pdb
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.download.outcome == 'success' }}
        shell: pwsh
        run: .github/osgeo4w-setup-bench/run.ps1 -Work C:\bench -Package qgis-ltr-pdb

      - name: Compare compression formats
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.download.outcome == 'success' }}
        shell: pwsh
        run: |
          python -m pip install --quiet zstandard
          # The debug symbol package is too large to recompress in memory.
          $pkgs = (Get-ChildItem C:\bench\pkgs\*.tar.bz2 | Where-Object { $_.Name -notlike "*-pdb-*" }).FullName
          $out = python .github/osgeo4w-setup-bench/formats.py $pkgs
          $out
          Add-Content $env:GITHUB_STEP_SUMMARY "## Format comparison`n`n$($out -join "`n")"
