name: OSGeo4W setup extraction benchmark

on:
  push:
    branches:
      - claude/busy-dirac-47uztw
    paths:
      - .github/workflows/osgeo4w-setup-bench.yml
      - .github/osgeo4w-setup-bench/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/osgeo4w-setup-bench

      - name: Check out the real OSGeo4W setup sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jef-n/OSGeo4W
          ref: 2a4fef009d86d52b35e25c43954d817cfec79e8e
          path: osgeo4w
          persist-credentials: false
          sparse-checkout: src/setup

      - name: Install flex and bison
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed bison flex"

      - name: Build the real setup (three variants)
        id: build
        shell: pwsh
        run: .github/osgeo4w-setup-bench/build_setup.ps1 -Source "$env:GITHUB_WORKSPACE\osgeo4w" -Work C:\bench

      - name: Create the local mirror and start the server
        id: mirror
        shell: pwsh
        run: |
          python .github/osgeo4w-setup-bench/make_mirror.py C:\bench\mirror python3-notebook python3-jupyterlab python3-core grass-dev qgis-ltr-pdb
          Start-Process python -ArgumentList '-m', 'http.server', '8000', '--bind', '127.0.0.1', '--directory', 'C:\bench\mirror' -WindowStyle Hidden
          Start-Sleep -Seconds 3
          (Invoke-WebRequest http://127.0.0.1:8000/x86_64/setup.ini -UseBasicParsing).StatusCode

      - name: Run the real setup variants
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.mirror.outcome == 'success' }}
        shell: pwsh
        run: .github/osgeo4w-setup-bench/run_setup.ps1 -Work C:\bench

      - name: 7-Zip on the same packages
        if: ${{ !cancelled() && steps.mirror.outcome == 'success' }}
        shell: pwsh
        run: .github/osgeo4w-setup-bench/sevenzip.ps1 -Work C:\bench
