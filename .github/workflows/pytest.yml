---
name: pytest

on:
  push:
    branches:
      - main
      - releasebranch_*
  pull_request:

permissions: {}

jobs:
  pytest:
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}-${{
        matrix.os }}-${{ matrix.python-version }}
      cancel-in-progress: true

    strategy:
      matrix:
        os:
          - ubuntu-24.04
        python-version:
          - "3.11"
          - "3.13"
      fail-fast: true

    runs-on: ${{ matrix.os }}
    env:
      FORCE_COLOR: 1 # for software including pip: https://force-color.org/
      CLICOLOR_FORCE: 1 # for other software including ninja: https://bixense.com/clicolors/
      PYTHONWARNINGS: always
      # Only exercise LLVM C coverage on the latest Python; the older one
      # runs the default gcc/no-instrumentation build for speed.
      GRASS_LLVM_COVERAGE: ${{ matrix.python-version == '3.13' && '1' || '0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip # zizmor: ignore[cache-poisoning] This pytest workflow not used for release artifacts
          allow-prereleases: true

      - name: Install non-Python dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget git gawk findutils
          LC_ALL=C.UTF-8 sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update -y
          xargs -a <(awk '! /^ *(#|$)/' ".github/workflows/apt.txt") -r -- \
              sudo apt-get install -y --no-install-recommends --no-install-suggests

      - name: Install LLVM coverage toolchain
        if: env.GRASS_LLVM_COVERAGE == '1'
        run: |
          sudo apt-get install -y --no-install-recommends --no-install-suggests \
              clang llvm libomp-dev

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages -r .github/workflows/python_requirements.txt
          pip install --break-system-packages -r .github/workflows/optional_requirements.txt
          pip install --break-system-packages GDAL=="$(gdal-config --version)"
          pip install --break-system-packages pytest pytest-timeout \
              pytest-github-actions-annotate-failures pytest-xdist pytest-cov

      - name: Create installation directory
        run: |
          mkdir "${HOME}/install"

      - name: Set number of cores for compilation
        run: |
          echo "MAKEFLAGS=-j$(nproc)" >> "${GITHUB_ENV}"

      - name: Build
        run: |
          ".github/workflows/build_${MATRIX_OS}.sh" "${HOME}/install"
        env:
          MATRIX_OS: ${{ matrix.os }}

      - name: Add the bin directory to PATH
        run: |
          echo "${HOME}/install/bin" >> "${GITHUB_PATH}"

      - name: Print installed versions
        if: always()
        run: .github/workflows/print_versions.sh

      - name: Test executing of the grass command
        run: .github/workflows/test_simple.sh

      - name: Prepare coverage directories
        run: |
          mkdir -p "${PWD}/llvm-cov-raw"
          # Wipe stray default.profraw the build step left behind (Makefiles
          # run instrumented tools to dump interface XML), so their build-
          # time data can't contaminate the test-run coverage.
          find . -name 'default.profraw' -type f -delete
          # %p (process id) separates every subprocess; %9m caps the per-binary
          # pool at 512 files so long suites don't create millions of tiny
          # .profraw. Together they eliminate the write-collision that made
          # earlier runs non-deterministic.
          {
            echo "LLVM_PROFILE_FILE=${PWD}/llvm-cov-raw/grass-%p-%9m.profraw"
            echo "INITIAL_GISBASE=$(grass --config path)"
            echo "INITIAL_PWD=${PWD}"
          } >> "${GITHUB_ENV}"

      - name: Run pytest with multiple workers in parallel
        run: |
          PYTHONPATH="$(grass --config python_path):${PYTHONPATH}"
          LD_LIBRARY_PATH="$(grass --config path)/lib:${LD_LIBRARY_PATH}"
          export PYTHONPATH
          export LD_LIBRARY_PATH
          pytest \
            @.github/workflows/pytest_args_ci.txt \
            @.github/workflows/pytest_args_cov.txt \
            @.github/workflows/pytest_args_parallel.txt \
            --junitxml=pytest.xdist.junit.xml \
            -k 'not testsuite'
        env:
          OMP_NUM_THREADS: 1

      - name: Run pytest with a single worker (for tests marked with needs_solo_run)
        run: |
          PYTHONPATH="$(grass --config python_path):${PYTHONPATH}"
          LD_LIBRARY_PATH="$(grass --config path)/lib:${LD_LIBRARY_PATH}"
          export PYTHONPATH
          export LD_LIBRARY_PATH
          pytest \
            @.github/workflows/pytest_args_ci.txt \
            @.github/workflows/pytest_args_cov.txt \
            @.github/workflows/pytest_args_not_parallel.txt \
            --junitxml=pytest.needs_solo_run.junit.xml \
            -k 'not testsuite'
      - name: Run pytest with a single worker (for gunittest-based tests)
        run: |
          PYTHONPATH="$(grass --config python_path):${PYTHONPATH}"
          LD_LIBRARY_PATH="$(grass --config path)/lib:${LD_LIBRARY_PATH}"
          export PYTHONPATH
          export LD_LIBRARY_PATH
          pytest \
            @.github/workflows/pytest_args_cov.txt \
            @.github/workflows/pytest_args_gunittest.txt \
            --junitxml=pytest.gunittest.junit.xml

      - name: Coverage disk usage (before combine)
        if: ${{ !cancelled() }}
        run: utils/coverage_disk_usage.sh

      - name: Combine Python coverage and export XML
        if: ${{ !cancelled() }}
        run: |
          # coverage combine must run before coverage_mapper.py: parallel
          # mode leaves .coverage.<host>.<pid>.<rand> partials and no
          # .coverage file for the mapper to read. Tolerate "no data" so
          # a build failure earlier in the job does not mask itself as a
          # later failure here.
          coverage combine || true
          if [ -f .coverage ]; then
              python utils/coverage_mapper.py
              if [ -f .coverage.fixed_scripts ]; then
                  mv .coverage.fixed_scripts .coverage
              fi
              coverage html
              coverage xml -o coverage.xml
          else
              echo "No .coverage data collected; skipping Python coverage export."
          fi

      - name: Merge and export LLVM C/C++ coverage
        if: ${{ !cancelled() && env.GRASS_LLVM_COVERAGE == '1' }}
        run: utils/llvm_coverage_export.sh

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          exclude: gui
          flags: pytest-python-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          verbose: true
          files: coverage.xml
          flags: pytest-python-${{ matrix.python-version }}
          name: pytest-python-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload LLVM C/C++ coverage to Codecov
        if: ${{ !cancelled() && env.GRASS_LLVM_COVERAGE == '1' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          verbose: true
          files: coverage-llvm.lcov
          flags: ubuntu-llvm-c
          name: ubuntu-llvm-c-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Make python-only code coverage test report available
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-codecoverage-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage_html_report
          retention-days: 1

  pytest-success:
    name: pytest Result
    needs:
      - pytest
    if: ${{ always() }}
    uses: ./.github/workflows/verify-success.yml
    with:
      needs_context: ${{ toJson(needs) }}
