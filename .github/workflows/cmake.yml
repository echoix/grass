---
name: CMake

# Documentation content under doc/ does not affect this build, only the
# CMakeLists.txt files there do, so they are added back after the doc/**
# exclusion (later patterns take precedence).
on:
  push:
    paths:
      - "**"
      - "!doc/**"
      - "doc/CMakeLists.txt"
      - "doc/**/CMakeLists.txt"
    branches:
      - main
      - releasebranch_*
  pull_request:
    paths:
      - "**"
      - "!doc/**"
      - "doc/CMakeLists.txt"
      - "doc/**/CMakeLists.txt"
  # Lets this branch's coverage-mechanism comparison be run on demand
  # without opening a PR, see doc/development/
  # sancov_coverage_experiment.md. Remove before merging.
  workflow_dispatch:

env:
  CMAKE_UNITY_BUILD: OFF

permissions:
  contents: read

jobs:
  build-cmake:
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}-${{
        matrix.sancov }}
      cancel-in-progress: true
    strategy:
      matrix:
        # sancov: gcc builds with -DWITH_SANCOV_COVERAGE=ON (opt-in
        # SanitizerCoverage experiment, see doc/development/
        # sancov_coverage_experiment.md) alongside the existing default
        # (uninstrumented) cell, gcc being what this workflow already
        # builds with.
        sancov:
          - none
          - gcc
      fail-fast: true
    runs-on: ubuntu-24.04
    env:
      CMAKE_VERSION: "3.22.0"
      GRASS_SANCOV_CMAKE_ARG: ${{ matrix.sancov == 'gcc' && '-DWITH_SANCOV_COVERAGE=ON' || '' }}
    steps:
      - name: Checkout GRASS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CMake
        run: |
          cd "${GITHUB_WORKSPACE}" || exit
          arch="$(echo "$(uname -s)"-"$(uname -m)" | awk '{print tolower($0)}')"
          v="v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-${arch}.tar.gz"
          wget "https://github.com/Kitware/CMake/releases/download/$v"
          tar xzf "cmake-${CMAKE_VERSION}-${arch}.tar.gz"
          echo "CMAKE_DIR=${GITHUB_WORKSPACE}/cmake-${CMAKE_VERSION}-${arch}/bin" >> "${GITHUB_ENV}"
          echo "${GITHUB_WORKSPACE}/cmake-${CMAKE_VERSION}-${arch}/bin" >> "${GITHUB_PATH}"
      - run: |
          cmake --version
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget git gawk findutils ninja-build libpq-dev \
            gettext unixodbc-dev libnetcdf-dev python3-wxgtk4.0
          LC_ALL=C.UTF-8 sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update -y
          xargs -a <(awk '! /^ *(#|$)/' ".github/workflows/apt.txt") -r -- \
              sudo apt-get install -y --no-install-recommends --no-install-suggests
      - name: Print build environment variables
        shell: bash -el {0}
        run: |
          printenv | sort
          gcc --version
          ldd --version
      - name: Create installation directory
        run: |
          mkdir "${HOME}/install"
      - name: Configure
        run: |
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="${HOME}/install" -DWITH_READLINE=ON -DWITH_ODBC=ON \
            -DWITH_NETCDF=ON -DWITH_BZLIB=ON ${GRASS_SANCOV_CMAKE_ARG}
      - name: Print CMakeCache.txt
        shell: bash -el {0}
        run: |
          cat "${GITHUB_WORKSPACE}/build/CMakeCache.txt"
      - name: Build
        run: |
          cmake --build build --verbose -j"$(nproc)"
      - name: Install
        run: |
          cmake --install "${GITHUB_WORKSPACE}/build" --verbose
      - name: Add the bin directory to PATH
        run: |
          echo "${HOME}/install/bin" >> "${GITHUB_PATH}"
      - name: Print installed versions
        if: always()
        run: .github/workflows/print_versions.sh
      - name: Test executing of the grass command
        run: .github/workflows/test_simple.sh
      - name: Prepare SanitizerCoverage dump directory
        if: matrix.sancov == 'gcc'
        run: |
          mkdir -p "${PWD}/sancov-raw"
          echo "GRASS_SANCOV_DUMP_DIR=${PWD}/sancov-raw" >> "${GITHUB_ENV}"
      - name: Run tests
        run: .github/workflows/test_thorough.sh --config .gunittest.cfg --min-success 100
      - name: Symbolize and summarize SanitizerCoverage
        if: ${{ !cancelled() && matrix.sancov == 'gcc' }}
        run: |
          python3 utils/sancov_symbolize.py "${GRASS_SANCOV_DUMP_DIR}" \
              --ignore-path-substring /usr/ \
              > sancov-coverage-summary.txt
          wc -l sancov-coverage-summary.txt
      - name: Make HTML test report available
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testreport-CMake-${{ matrix.sancov }}
          path: testreport
          retention-days: 3
      - name: Make SanitizerCoverage summary available
        if: ${{ !cancelled() && matrix.sancov == 'gcc' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sancov-coverage-summary-cmake
          path: sancov-coverage-summary.txt
          retention-days: 7
