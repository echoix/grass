---
name: OSGeo4W

on:
  push:
    branches:
      - main
      - releasebranch_*
  pull_request:

permissions: {}

jobs:
  build:
    name: ${{ matrix.os }} build and tests

    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}-${{
        matrix.os }}
      cancel-in-progress: true

    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNINGS: always
    strategy:
      matrix:
        os:
          - windows-2022
      fail-fast: false

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        id: msys2
        with:
          path-type: inherit
          location: D:\
          update: true
          msystem: MINGW64
          install: >-
            bison
            diffutils
            dos2unix
            flex
            git
            libintl
            make
            tar
            zip
          pacboy: >-
            bzip2
            ccache
            fftw
            gcc
            gettext
            libiconv
            libsystre
            libtre
            libwinpthread-git
            openblas
            pcre
            pkgconf
            toolchain
            zlib

      - name: Setup OSGeo4W environment
        uses: echoix/setup-OSGeo4W@1e711832882e03603e9013181a87885b10af8a98 # v0.3.0
        id: osgeo4w
        with:
          package-dir: "D:/OSGeo4W_pkg"
          packages: |
            cairo-devel
            freetype-devel
            gdal-devel
            geos-devel
            libjpeg-turbo-devel
            liblas-devel
            libpng-devel
            libpq-devel
            libtiff-devel
            netcdf-devel
            proj-devel
            python3-core
            python3-gdal
            python3-jupyter
            python3-matplotlib
            python3-numpy
            python3-pip
            python3-pywin32
            python3-wxpython
            sqlite3-devel
            zstd-devel

      - name: Set number of cores for compilation
        run: |
          echo "MAKEFLAGS=-j$(nproc)" >> "${GITHUB_ENV}"
        shell: msys2 {0}

      - name: Compile GRASS
        shell: msys2 {0}
        run: |
          .github/workflows/build_osgeo4w.sh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}

      - name: "[CI diagnostic, not for merge] Dump grass_gis.8.6.dll exports/imports"
        # Finds the exact missing symbol behind the
        # "Windows fatal exception: code 0xc0000139" crash seen when
        # ctypes loads grass_gis.8.6.dll. Package-level dumpbin diffs of
        # gdal313.dll, curl, openssl, libjpeg-turbo, expat, and proj (the
        # only OSGeo4W packages that changed in the regression window)
        # found no removed exports or broken ordinals, and downgrading
        # the MSYS2 mingw-w64 toolchain snapshot didn't fix the crash
        # either, so this inspects the freshly compiled DLL directly.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find '**\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) {
            Write-Output '::error::dumpbin.exe not found via vswhere'
            exit 1
          }
          Write-Output "Using dumpbin: $dumpbin"

          $dlls = @(
            'dist.x86_64-w64-mingw32\lib\libgrass_gis.8.6.dll',
            'dist.x86_64-w64-mingw32\lib\libgrass_datetime.8.6.dll',
            'dist.x86_64-w64-mingw32\lib\libgrass_arraystats.8.6.dll',
            'dist.x86_64-w64-mingw32\lib\libgrass_rowio.8.6.dll',
            'dist.x86_64-w64-mingw32\lib\libgrass_vector.8.6.dll'
          )
          foreach ($dll in $dlls) {
            if (-not (Test-Path $dll)) {
              Write-Output "::warning::$dll not found, skipping"
              continue
            }
            Write-Output "::group::$dll dependents"
            & $dumpbin /dependents $dll
            Write-Output '::endgroup::'
            Write-Output "::group::$dll full import table"
            & $dumpbin /imports $dll
            Write-Output '::endgroup::'
          }

      - name: Print installed versions
        if: always()
        shell: msys2 {0}
        run: .github/workflows/print_versions.sh

      - name: Test executing of the grass command
        run: .github/workflows/test_simple.bat '%O4WROOT%\opt\grass\grass86.bat'
        env:
          O4WROOT: ${{ steps.osgeo4w.outputs.root }}

      - name: Test executing of the grass command in bash
        shell: msys2 {0}
        run: .github/workflows/test_simple.sh

      - name: Install additional python packages
        run: |
          python -m pip install ^
            pytest ^
            pytest-timeout ^
            pytest-xdist ^
            pytest-randomly
        # Obfuscated usage of GitHub Actions features, Windows CMD shell limits analysis
        shell: cmd /D /E:ON /V:OFF /S /C "CALL C:/OSGeo4W/OSGeo4W.bat "{0}"" # zizmor: ignore[misfeature]
      - name: Run pytest with multiple workers in parallel
        run: |
          call %OSGEO4W_ROOT%\opt\grass\etc\env.bat
          set PYTHONPATH=%GISBASE%\etc\python;%PYTHONPATH%
          path %GISBASE%\lib;%GISBASE%\bin;%PATH%
          pytest ^
            @.github/workflows/pytest_args_ci.txt ^
            @.github/workflows/pytest_args_parallel.txt ^
            --junitxml=pytest.xdist.junit.xml ^
            -k "not testsuite"
        env:
          OMP_NUM_THREADS: 1
        # Obfuscated usage of GitHub Actions features, Windows CMD shell limits analysis
        shell: cmd /D /E:ON /V:OFF /S /C "CALL C:/OSGeo4W/OSGeo4W.bat "{0}"" # zizmor: ignore[misfeature]
      - name: Run pytest with a single worker (for tests marked with needs_solo_run)
        run: |
          call %OSGEO4W_ROOT%\opt\grass\etc\env.bat
          set PYTHONPATH=%GISBASE%\etc\python;%PYTHONPATH%
          path %GISBASE%\lib;%GISBASE%\bin;%PATH%
          pytest ^
            @.github/workflows/pytest_args_ci.txt ^
            @.github/workflows/pytest_args_not_parallel.txt ^
            --junitxml=pytest.needs_solo_run.junit.xml ^
            -k "not testsuite"
        # Obfuscated usage of GitHub Actions features, Windows CMD shell limits analysis
        shell: cmd /D /E:ON /V:OFF /S /C "CALL C:/OSGeo4W/OSGeo4W.bat "{0}"" # zizmor: ignore[misfeature]
      - name: Run pytest with a single worker (for gunittest-based tests)
        run: |
          call %OSGEO4W_ROOT%\opt\grass\etc\env.bat
          set PYTHONPATH=%GISBASE%\etc\python;%PYTHONPATH%
          path %GISBASE%\lib;%GISBASE%\bin;%PATH%;%OSGEO4W_ROOT%\opt\grass
          pytest ^
            @.github/workflows/pytest_args_ci.txt ^
            @.github/workflows/pytest_args_deselect.txt ^
            @.github/workflows/pytest_args_gunittest.txt ^
            --junitxml=pytest.gunittest.junit.xml
        # Obfuscated usage of GitHub Actions features, Windows CMD shell limits analysis
        shell: cmd /D /E:ON /V:OFF /S /C "CALL C:/OSGeo4W/OSGeo4W.bat "{0}"" # zizmor: ignore[misfeature]

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          exclude: gui
          flags: ${{ matrix.os }}-pytest-python
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Run tests
        run: .github/workflows/test_thorough.bat '%O4WROOT%\opt\grass\grass86.bat' '%O4WROOT%\bin\python3'
        env:
          O4WROOT: ${{ steps.osgeo4w.outputs.root }}

      - name: Make HTML test report available
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testreport-${{ matrix.os }}
          path: testreport
          retention-days: 3
