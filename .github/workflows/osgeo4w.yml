---
name: OSGeo4W

on:
  push:
    branches:
      - main
      - releasebranch_*
  pull_request:

permissions: {}

jobs:
  build:
    name: ${{ matrix.os }} build and tests

    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}-${{
        matrix.os }}
      cancel-in-progress: true

    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNINGS: always
    strategy:
      matrix:
        os:
          - windows-2022
      fail-fast: false

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        id: msys2
        with:
          path-type: inherit
          location: D:\
          update: true
          msystem: MINGW64
          install: >-
            bison
            diffutils
            dos2unix
            flex
            git
            libintl
            make
            tar
            zip
          pacboy: >-
            bzip2
            ccache
            fftw
            gcc
            gettext
            libiconv
            libsystre
            libtre
            libwinpthread-git
            openblas
            pcre
            pkgconf
            toolchain
            zlib

      - name: Setup OSGeo4W environment
        uses: echoix/setup-OSGeo4W@1e711832882e03603e9013181a87885b10af8a98 # v0.3.0
        id: osgeo4w
        with:
          package-dir: "D:/OSGeo4W_pkg"
          packages: |
            cairo-devel
            freetype-devel
            gdal-devel
            geos-devel
            libjpeg-turbo-devel
            liblas-devel
            libpng-devel
            libpq-devel
            libtiff-devel
            netcdf-devel
            proj-devel
            python3-core
            python3-gdal
            python3-jupyter
            python3-matplotlib
            python3-numpy
            python3-pip
            python3-pywin32
            python3-wxpython
            sqlite3-devel
            zstd-devel

      - name: Set number of cores for compilation
        run: |
          echo "MAKEFLAGS=-j$(nproc)" >> "${GITHUB_ENV}"
        shell: msys2 {0}

      - name: Compile GRASS
        shell: msys2 {0}
        run: |
          .github/workflows/build_osgeo4w.sh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}

      - name: Print installed versions
        if: always()
        shell: msys2 {0}
        run: .github/workflows/print_versions.sh

      - name: Test executing of the grass command
        run: .github/workflows/test_simple.bat '%O4WROOT%\opt\grass\grass86.bat'
        env:
          O4WROOT: ${{ steps.osgeo4w.outputs.root }}

      - name: Test executing of the grass command in bash
        shell: msys2 {0}
        run: .github/workflows/test_simple.sh

      - name: Install additional python packages
        run: |
          python -m pip install ^
            pytest ^
            pytest-timeout ^
            pytest-xdist ^
            pytest-randomly
        # Obfuscated usage of GitHub Actions features, Windows CMD shell limits analysis
        shell: cmd /D /E:ON /V:OFF /S /C "CALL C:/OSGeo4W/OSGeo4W.bat "{0}"" # zizmor: ignore[misfeature]

      - name: "[CI diagnostic, not for merge] Dump libgomp-1.dll / libsystre-0.dll exports"
        # Completes an exhaustive symbol-level cross-check of grass_gis.8.6.dll's
        # entire non-system dependency closure (gdal313.dll, curl, openssl,
        # libjpeg-turbo, expat, PROJ, sqlite3, libxml2, brotli, zstd all
        # already checked clean offline). These two MSYS2-provided libraries
        # could only be spot-checked locally against a non-identical build,
        # so dump the real ones here.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find '**\dumpbin.exe' | Select-Object -First 1
          foreach ($dll in @('libgomp-1.dll', 'libsystre-0.dll')) {
            $path = "D:\msys64\mingw64\bin\$dll"
            if (Test-Path $path) {
              Write-Output "::group::$dll exports"
              & $dumpbin /exports $path
              Write-Output '::endgroup::'
            } else {
              Write-Output "::warning::$path not found"
            }
          }

      - name: "[CI diagnostic, not for merge] Enable loader snaps and locate cdb.exe"
        # Every native dependency in this investigation has been checked
        # clean via manual dumpbin export/import diffing (GDAL, curl,
        # OpenSSL, libjpeg-turbo, expat, PROJ, sqlite3, libxml2, brotli,
        # zstd, msvcrt2019, and all MSYS2-provided libraries). Rather
        # than continue guessing which binary might have an unresolved
        # symbol, this asks Windows' own loader directly: enables Loader
        # Snaps (verbose OS-level trace of every module load and symbol
        # resolution step) for python.exe via the Image File Execution
        # Options GlobalFlag. DebugView (a GUI app) was tried first but
        # never produced a log file at all, with or without its /k switch,
        # most likely because GitHub Actions runs steps in a non-interactive
        # Session 0 where its window/message pump cannot initialize. cdb.exe
        # (console-mode debugger, part of the Windows SDK Debugging Tools)
        # is a debugger itself, which is the OS-level sink loader snaps are
        # designed to write to, and needs no desktop session.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ifeoPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\python.exe'
          New-Item -Path $ifeoPath -Force | Out-Null
          New-ItemProperty -Path $ifeoPath -Name 'GlobalFlag' -PropertyType DWord -Value 0x2 -Force | Out-Null

          $candidates = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe",
            "${env:ProgramFiles}\Windows Kits\10\Debuggers\x64\cdb.exe"
          )
          $cdb = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) {
            Write-Output "cdb.exe not preinstalled, installing Debugging Tools for Windows via choco"
            choco install windbg -y --no-progress
            $cdb = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) {
            throw "cdb.exe could not be found or installed"
          }
          Write-Output "Using cdb at $cdb"
          Set-Content -Path "$env:RUNNER_TEMP\cdb_path.txt" -Value $cdb -NoNewline

      - name: "[CI diagnostic, not for merge] Run python -m pytest under cdb (loader snaps)"
        run: |
          call C:\OSGeo4W\opt\grass\etc\env.bat
          set PYTHONPATH=%GISBASE%\etc\python;%PYTHONPATH%
          path %GISBASE%\lib;%GISBASE%\bin;%PATH%
          set /p CDB_PATH=<"%RUNNER_TEMP%\cdb_path.txt"
          "%CDB_PATH%" -g -G -c "g;q" python -m pytest -v imagery/i.gensig/testsuite/test_i_gensig.py lib/arraystats/tests > "%RUNNER_TEMP%\cdb_output.log" 2>&1
          type "%RUNNER_TEMP%\cdb_output.log"
        # Obfuscated usage of GitHub Actions features, Windows CMD shell limits analysis
        shell: cmd /D /E:ON /V:OFF /S /C "CALL C:/OSGeo4W/OSGeo4W.bat "{0}"" # zizmor: ignore[misfeature]
        continue-on-error: true

      - name: "[CI diagnostic, not for merge] Dump cdb loader snaps output"
        if: always()
        shell: pwsh
        run: |
          $logfile = "$env:RUNNER_TEMP\cdb_output.log"
          if (Test-Path $logfile) {
            Write-Output "::group::Full cdb output line count"
            (Get-Content $logfile).Count
            Write-Output '::endgroup::'
            Write-Output '::group::cdb output (filtered for LDR/not found/procedure/ModLoad/python/grass_/Exception)'
            Get-Content $logfile | Select-String -Pattern 'LDR|not found|procedure|ModLoad|python|grass_|proj_9|gdal313|Exception' | Select-Object -First 1000
            Write-Output '::endgroup::'
          } else {
            Write-Output '::error::No cdb output log was produced'
          }

      - name: Run pytest with multiple workers in parallel
        run: |
          call %OSGEO4W_ROOT%\opt\grass\etc\env.bat
          set PYTHONPATH=%GISBASE%\etc\python;%PYTHONPATH%
          path %GISBASE%\lib;%GISBASE%\bin;%PATH%
          pytest ^
            @.github/workflows/pytest_args_ci.txt ^
            @.github/workflows/pytest_args_parallel.txt ^
            --junitxml=pytest.xdist.junit.xml ^
            -k "not testsuite"
        env:
          OMP_NUM_THREADS: 1
        # Obfuscated usage of GitHub Actions features, Windows CMD shell limits analysis
        shell: cmd /D /E:ON /V:OFF /S /C "CALL C:/OSGeo4W/OSGeo4W.bat "{0}"" # zizmor: ignore[misfeature]
      - name: Run pytest with a single worker (for tests marked with needs_solo_run)
        run: |
          call %OSGEO4W_ROOT%\opt\grass\etc\env.bat
          set PYTHONPATH=%GISBASE%\etc\python;%PYTHONPATH%
          path %GISBASE%\lib;%GISBASE%\bin;%PATH%
          pytest ^
            @.github/workflows/pytest_args_ci.txt ^
            @.github/workflows/pytest_args_not_parallel.txt ^
            --junitxml=pytest.needs_solo_run.junit.xml ^
            -k "not testsuite"
        # Obfuscated usage of GitHub Actions features, Windows CMD shell limits analysis
        shell: cmd /D /E:ON /V:OFF /S /C "CALL C:/OSGeo4W/OSGeo4W.bat "{0}"" # zizmor: ignore[misfeature]
      - name: Run pytest with a single worker (for gunittest-based tests)
        run: |
          call %OSGEO4W_ROOT%\opt\grass\etc\env.bat
          set PYTHONPATH=%GISBASE%\etc\python;%PYTHONPATH%
          path %GISBASE%\lib;%GISBASE%\bin;%PATH%;%OSGEO4W_ROOT%\opt\grass
          pytest ^
            @.github/workflows/pytest_args_ci.txt ^
            @.github/workflows/pytest_args_deselect.txt ^
            @.github/workflows/pytest_args_gunittest.txt ^
            --junitxml=pytest.gunittest.junit.xml
        # Obfuscated usage of GitHub Actions features, Windows CMD shell limits analysis
        shell: cmd /D /E:ON /V:OFF /S /C "CALL C:/OSGeo4W/OSGeo4W.bat "{0}"" # zizmor: ignore[misfeature]

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          exclude: gui
          flags: ${{ matrix.os }}-pytest-python
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

      - name: Run tests
        run: .github/workflows/test_thorough.bat '%O4WROOT%\opt\grass\grass86.bat' '%O4WROOT%\bin\python3'
        env:
          O4WROOT: ${{ steps.osgeo4w.outputs.root }}

      - name: Make HTML test report available
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testreport-${{ matrix.os }}
          path: testreport
          retention-days: 3
