name: OSGeo4W setup on Cygwin base benchmark

on:
  push:
    branches:
      - claude/osgeo4w-setup-rebase
    paths:
      - .github/workflows/osgeo4w-setup-rebase.yml
      - .github/osgeo4w-setup-bench/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://sourceware.org/git/cygwin-apps/setup.git
  UPSTREAM_SHA: 3b156c26b5ee2b1d8381b8080122c230bfa2294b

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/osgeo4w-setup-bench

      - name: Which libraries does MSYS2 have?
        shell: cmd
        run: >
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy >/dev/null; for p in libsolv libgnurx libsystre libgcrypt zstd xz bzip2 zlib gcc cmake ninja; do echo == $p; pacman -Ss \"^mingw-w64-x86_64-$p\"; done; pacman -Ss solv | head"
