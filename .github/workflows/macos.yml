---
name: macOS

# Build and run tests on macOS

on:
  push:
    branches:
      - main
      - releasebranch_*
  pull_request:
env:
  CACHE_NUMBER: 0
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  macos_build:
    name: macOS build
    runs-on: macos-26
    env:
      PYTHONWARNINGS: always
      GRASS_LLVM_COVERAGE: "1"
    steps:
      - name: Info
        run: |
          echo "macOS version $(sw_vers -productVersion)"
          echo "architecture $(uname -a)"
      - name: Disabling Spotlight
        run: sudo mdutil -a -i off
      - name: Uninstalling Homebrew
        run: |
          echo "Moving directories..."
          sudo mkdir /opt/local-off /opt/homebrew-off
          test ! -d /usr/local || /usr/bin/sudo /usr/bin/find /usr/local \
            -mindepth 1 -maxdepth 1 -type d -print -exec /bin/mv {} \
            /opt/local-off/ \;
          test ! -d /opt/homebrew || /usr/bin/sudo /usr/bin/find /opt/homebrew \
            -mindepth 1 -maxdepth 1 -type d -print -exec /bin/mv {} \
            /opt/homebrew-off/ \;
          echo "Removing files..."
          test ! -d /usr/local || /usr/bin/sudo /usr/bin/find /usr/local \
            -mindepth 1 -maxdepth 1 -type f -print -delete
          test ! -d /opt/homebrew || /usr/bin/sudo /usr/bin/find /opt/homebrew \
            -mindepth 1 -maxdepth 1 -type f -print -delete
          # Rehash to forget about the deleted files
          hash -r
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get current date cache key segment
        id: date
        # Year and week of year so cache key changes weekly
        run: echo "date=$(date +%Y-%U)" >> "${GITHUB_OUTPUT}"
      - name: Prepare Conda environment file
        env:
          test_dependencies: |
            coverage
            ipython
            llvm-tools
            pytest
            pytest-cov
            pytest-github-actions-annotate-failures
            pytest-timeout
            pytest-xdist
            pyyaml
        run: |
          cp ./macos/files/conda-requirements-dev-arm64.txt "${RUNNER_TEMP}/macos_dependencies.txt"
          echo "${test_dependencies// /\n}" >> "${RUNNER_TEMP}/macos_dependencies.txt"
      - name: Setup Mamba
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476 # v3.0.0
        with:
          init-shell: bash
          environment-file: ${{ runner.temp }}/macos_dependencies.txt
          environment-name: grass-env
          # Persist on the same period (date).
          cache-environment-key: environment-${{ steps.date.outputs.date }}

      - name: Environment info
        shell: bash -el {0}
        run: |
          printenv | sort
          $CC --version
      - name: Create installation directory
        run: mkdir "${HOME}/install"
      - name: Build and install
        shell: micromamba-shell {0}
        run: source ./.github/workflows/macos_install.sh "${HOME}/install"
      - name: Add the bin directory to PATH
        run: echo "${HOME}/install/bin" >> "${GITHUB_PATH}"
      - name: Check installed version
        if: ${{ !cancelled() }}
        shell: micromamba-shell {0}
        run: source ./.github/workflows/print_versions.sh

      - name: Prepare coverage directories
        shell: micromamba-shell {0}
        run: |
          mkdir -p "${PWD}/llvm-cov-raw"
          # Wipe stray default.profraw the build step left behind (Makefiles
          # run instrumented tools to dump interface XML) before the tests
          # start writing controlled per-PID files.
          find . -name 'default.profraw' -type f -delete
          # %p (process id) separates every subprocess; %9m caps the per-binary
          # pool at 512 files so long xdist runs don't fill the runner disk.
          {
            echo "LLVM_PROFILE_FILE=${PWD}/llvm-cov-raw/grass-%p-%9m.profraw"
            echo "INITIAL_GISBASE=$(grass --config path)"
            echo "INITIAL_PWD=${PWD}"
          } >> "${GITHUB_ENV}"

      - name: Run pytest with multiple workers in parallel
        shell: micromamba-shell {0}
        run: |
          PYTHONPATH="$(grass --config python_path):${PYTHONPATH}"
          LD_LIBRARY_PATH="$(grass --config path)/lib:${LD_LIBRARY_PATH}"
          export PYTHONPATH
          export LD_LIBRARY_PATH
          pytest \
            @.github/workflows/pytest_args_ci.txt \
            @.github/workflows/pytest_args_cov.txt \
            @.github/workflows/pytest_args_parallel.txt \
            --junitxml=pytest.xdist.junit.xml \
            -k 'not testsuite'
        env:
          OMP_NUM_THREADS: 1

      - name: Run pytest with a single worker (for tests marked with needs_solo_run)
        shell: micromamba-shell {0}
        run: |
          PYTHONPATH="$(grass --config python_path):${PYTHONPATH}"
          LD_LIBRARY_PATH="$(grass --config path)/lib:${LD_LIBRARY_PATH}"
          export PYTHONPATH
          export LD_LIBRARY_PATH
          pytest \
            @.github/workflows/pytest_args_ci.txt \
            @.github/workflows/pytest_args_cov.txt \
            @.github/workflows/pytest_args_not_parallel.txt \
            --junitxml=pytest.needs_solo_run.junit.xml \
            -k 'not testsuite'
      - name: Run pytest with a single worker (for gunittest-based tests)
        shell: micromamba-shell {0}
        run: |
          PYTHONPATH="$(grass --config python_path):${PYTHONPATH}"
          LD_LIBRARY_PATH="$(grass --config path)/lib:${LD_LIBRARY_PATH}"
          export PYTHONPATH
          export LD_LIBRARY_PATH
          pytest \
            @.github/workflows/pytest_args_cov.txt \
            @.github/workflows/pytest_args_gunittest.txt \
            --junitxml=pytest.gunittest.junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          exclude: gui
          flags: macos-pytest-python
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          skip_validation: true

      - name: Cache GRASS Sample Dataset
        id: cached-data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sample-data/nc_spm_full_v2beta1.tar.gz
          key: nc_spm_full_v2beta1.tar.gz
          enableCrossOsArchive: true

      - name: Download GRASS Sample Dataset
        if: steps.cached-data.outputs.cache-hit != 'true'
        run: |
          mkdir -p sample-data
          curl -L "$SAMPLE_DATA" -o sample-data/nc_spm_full_v2beta1.tar.gz
        env:
          SAMPLE_DATA: "https://grass.osgeo.org/sampledata/north_carolina/\
            nc_spm_full_v2beta1.tar.gz"

      - name: Save GRASS Sample Dataset to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cached-data.outputs.cache-hit != 'true'
        with:
          path: sample-data/nc_spm_full_v2beta1.tar.gz
          key: nc_spm_full_v2beta1.tar.gz

      - name: Run gunittest tests
        shell: micromamba-shell {0}
        run: .github/workflows/test_thorough.sh --config .github/workflows/macos_gunittest.cfg
        env:
          SAMPLE_DATA_URL: "file://${{ github.workspace }}/sample-data/\
            nc_spm_full_v2beta1.tar.gz"

      - name: Coverage disk usage (before combine)
        if: ${{ !cancelled() }}
        shell: micromamba-shell {0}
        run: utils/coverage_disk_usage.sh

      - name: Combine Python coverage and export XML
        if: ${{ !cancelled() }}
        shell: micromamba-shell {0}
        run: |
          # coverage combine before coverage_mapper.py: parallel mode leaves
          # only .coverage.<host>.<pid>.<rand> partials, no .coverage yet.
          coverage combine || true
          if [ -f .coverage ]; then
              python utils/coverage_mapper.py
              if [ -f .coverage.fixed_scripts ]; then
                  mv .coverage.fixed_scripts .coverage
              fi
              coverage html
              coverage xml -o coverage.xml
          else
              echo "No .coverage data collected; skipping Python coverage export."
          fi

      - name: Merge and export LLVM C/C++ coverage
        if: ${{ !cancelled() }}
        shell: micromamba-shell {0}
        run: utils/llvm_coverage_export.sh

      - name: Upload Python coverage to Codecov (macOS)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          verbose: true
          files: coverage.xml
          flags: macos-pytest-python
          name: macos-pytest-python
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload LLVM C/C++ coverage to Codecov (macOS)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          verbose: true
          files: coverage-llvm.lcov
          flags: macos-llvm-c
          name: macos-llvm-c
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Make python-only code coverage test report available
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-codecoverage-report-macOS
          path: coverage_html_report
          retention-days: 1

      - name: Make HTML test report available
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testreport-macOS
          path: testreport
          retention-days: 3
