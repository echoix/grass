[project]
name = "grass"
requires-python = ">=3.11"
# *GRASS TODO: keep in sync with MIN_PYTHON_VERSION supported*

[tool.black]
line-length = 88
required-version = '25'
target-version = ['py311', 'py312', 'py313', 'py314']
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
(
    python/grass/temporal/ply/|
    python/libgrass_interface_generator/
)
'''

[tool.codespell]
ignore-words-list = [
    "BLOC",   # Seems unused
    "Bui",
    "Collet",
    "Flor",
    "Greif",
    "Hart",
    "Huld",
    "Linke",
    "OnText",
    "Tripel",
    "ans",    # TODO: Replace with a word
    "anull",
    "datas",
    "delt",
    "flor",
    "indx",
    "inout",
    "linz",
    "lsat",
    "makin",
    "nin",
    "parm",
    "parms",
    "siz",
    "vizual",
    "ETo",    # Evapotranspiration technical term
    "Eto",    # Evapotranspiration technical term
    "eto",    # Evapotranspiration technical term
    "ist",    # Part of acronyms (IST-SUPSI, etc.)
    "IHS",    # Color model: Intensity-Hue-Saturation
    "ihs",    # Color model: Intensity-Hue-Saturation
    "ALOG",   # Function name
    "Redner", # Person's name in citation
    "NED",    # Acronym/proper name
    "linke",  # Linke turbidity factor parameter
    "infex",  # Infiltration excess parameter
    "alle",   # Italian word in references
    "mapp",   # Keyword argument name in the public create_time_suffix() API
    "asnd",        # Email address username in lib/cdhc/doc/index.sty
    "APoints",     # Variable name, pairs with BPoints
    "cnA",         # r.stats flag
    "doubleClick", # Event argument name in wxPython code
    "expres",      # Abbreviated option names tested in parse_mapcalc_cmd doctests
    "expressio",   # Abbreviated option names tested in parse_mapcalc_cmd doctests
    "loner",       # Name of a raster map that is not in any dataset in a test
]
quiet-level = 3
skip = [
    "config.guess",
    "python/grass/temporal/ply/*",              # Vendored PLY parser
    "python/libgrass_interface_generator/*",    # Vendored ctypesgen
    "gui/icons/grass.desktop",
    "gui/wxpython/xml/grass-gxw.dtd",     # TODO
    "lib/cdhc/doc/goodness.ps",
    "lib/datetime/README",
    "lib/external/ccmath/C01-matrix",
    "lib/fonts/fonts/hersh.o*",           # TODO
    "lib/gis/FIPS.code",                  # TODO
    "lib/gis/datumtransform.table",       # TODO
    "lib/gis/ellipse.table",              # TODO
    "lib/gis/renamed_options",
    "lib/proj/*.table",                   # TODO
    "lib/rst/interp_float/print_tre",     # TODO
    "lib/rst/interp_float/print_tree",    # TODO
    "locale/*.po",
    "locale/*.pot",
    "locale/*.tbx",
    "mswindows/GRASS-Installer.nsi.tmpl", # TODO
    "raster/r.walk/TODO",                 # TODO
    "rpm/grass.spec",                     # TODO
    "utils/fix_typos.sh",
    "utils/release.yml",                  # TODO
    '*.dox',                              # TODO
    "*.svg",                              # Embedded base64 image data
]

[tool.ruff]
required-version = ">=0.8.0"

builtins = ["_"]

# In addition to the standard set of exclusions, omit the following files or folders.
extend-exclude = [
    "python/grass/temporal/ply",           # External code
    "python/libgrass_interface_generator",
]

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/
external = ["C2801"]

select = [
    "A",      # flake8-builtins (A)
    "AIR",    # Airflow (AIR)
    "ANN",    # flake8-annotations (ANN)
    "ARG",    # flake8-unused-arguments (ARG)
    "ASYNC",  # flake8-async (ASYNC)
    "B",      # flake8-bugbear (B)
    "BLE",    # flake8-blind-except (BLE)
    "C4",     # flake8-comprehensions (C4)
    "COM",    # flake8-commas (COM)
    "D",      # pydocstyle (D)
    "D202",   # pydocstyle (D) blank-line-after-function
    "D209",   # pydocstyle (D) new-line-after-last-paragraph
    "D211",   # pydocstyle (D) blank-line-before-class
    "D212",   # pydocstyle (D) multi-line-summary-first-line
    "DTZ",    # flake8-datetimez (DTZ)
    "E",      # pycodestyle (E, W)
    "EM",     # flake8-errmsg (EM)
    "EXE",    # flake8-executable (EXE)
    "F",      # Pyflakes (F)
    "FA",     # flake8-future-annotations (FA)
    "FBT",    # flake8-boolean-trap (FBT)
    "FLY",    # flynt (FLY)
    "FURB",   # refurb (FURB)
