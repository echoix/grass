[tool.ruff.lint.flake8-import-conventions.extend-aliases]
# Declare a custom aliases, checked with rule ICN001
"grass.script" = "gs"
"grass.temporal" = "tgis"
# Ruff 0.17 added a default alias of dt for datetime; keep the existing import style.
datetime = "datetime"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = """
    --import-mode=importlib
    --ignore-glob='dist.*'
    --ignore-glob='bin.*'
    --ignore-glob='*/tests/data/*'
    --ignore-glob='*/testsuite/data/**'
    --ignore-glob='*/grass/pygrass/tests/*'
    --doctest-glob='*doctest*.txt'
    --ignore='raster/r.category/test_rcategory_doctest.txt'
"""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "needs_solo_run: marks tests that must be run without any other tests running in parallel",
]
minversion = "8.2"
python_files = """
    */tests/*_test.py
    */tests/test_*.py
    **/testsuite/*test*.py
"""
timeout = 300


[tool.bandit]
exclude_dirs = [
    "./testsuite",
    "*/tests/*",
    "*/testsuite/*",
    "utils/test_generate_last_commit_file.py",
    # Vendored code, matching the pylint ignore-paths entries below.
    "python/grass/temporal/ply",
    "python/libgrass_interface_generator",
]
skips = ["B324", "B110", "B101", "B112", "B311", "B404", "B603"]


[tool.pylint.main]
# Pylint complements Ruff: Ruff runs first and enforces style, import order,
# unused code and the other checks it implements, and Pylint is kept for what
# needs inference across modules. Messages are enabled by default and the
# ones we do not use are listed in "messages control" below, with the reason.

# Directories matching these regular expressions are skipped, they hold build
# output and generated or vendored code.
ignore-paths = [
    "bin[.].*",                            # Autotools build output
    "build[/].*",                          # CMake build directory
    "dist[.].*",                           # Autotools build output
    "gui/wxpython/menustrings.py",         # Generated
    "python/grass/temporal/ply",           # External code
    "python/libgrass_interface_generator", # External code
]

# Files and directories with a base name matching are skipped.
ignore-patterns = ["OBJ[.].*"]

# Use all the available processors.
jobs = 0

# Minimum Python version to use for version dependent checks.
# *GRASS TODO: keep in sync with MIN_PYTHON_VERSION supported*
py-version = "3.11"

# The source roots are where imports of the local packages are resolved from,
# like PYTHONPATH does at runtime.
source-roots = ["python", "gui/wxpython", "man"]


[tool.pylint."messages control"]
disable = [
    # Not wanted: style choices we do not follow or enforce
    "C0103",  # invalid-name
    "C0104",  # disallowed-name
    "C0112",  # empty-docstring
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0209",  # consider-using-f-string, translatable messages need str.format()
    "C0301",  # line-too-long, left to the formatter
    "C0415",  # import-outside-toplevel, imports are deferred on purpose
    "W0511",  # fixme

    # Not wanted: size and complexity limits
    "C0302",  # too-many-lines
    "R0901",  # too-many-ancestors
    "R0902",  # too-many-instance-attributes
    "R0903",  # too-few-public-methods
    "R0904",  # too-many-public-methods
    "R0911",  # too-many-return-statements
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0916",  # too-many-boolean-expressions
    "R0917",  # too-many-positional-arguments
    "R1702",  # too-many-nested-blocks

    # Not wanted: duplicate-code takes about a quarter of the run time and,
    # with a threshold of 50 lines, finds only copied GUI and test modules.
    "similarities",

    # Ruff reports the same cases, Pylint would report them a second time.
    "C0411",  # wrong-import-order, I001
    "C0412",  # ungrouped-imports, I001
    "C0413",  # wrong-import-position, E402
    "W0611",  # unused-import, F401

    # Inference is not reliable here: names defined at runtime (the builtin
    # "_" installed by the grass package, ctypes bindings from grass.lib) and
    # modules not installed for the Pylint run (wxPython, GDAL).
    "E0401",  # import-error
    "E0611",  # no-name-in-module
    "E1101",  # no-member
    "E1102",  # not-callable, reported for "_"

    # To fix and enable, ordered by message ID.
    # *GRASS TODO: Try to ignore less rules*
    "C0200",  # consider-using-enumerate
    "C0201",  # consider-iterating-dictionary
    "C0204",  # bad-mcs-classmethod-argument
    "C0206",  # consider-using-dict-items, PLC0206 misses iteration over .keys()
    "C0207",  # use-maxsplit-arg
    "C0325",  # superfluous-parens
    "C1802",  # use-implicit-booleaness-not-len, PLC1802 misses "not len(x)"
    "C1803",  # use-implicit-booleaness-not-comparison
    "C2801",  # unnecessary-dunder-call
    "E0203",  # access-member-before-definition
    "E0213",  # no-self-argument
    "E0601",  # used-before-assignment
    "E0602",  # undefined-variable
    "E0606",  # possibly-used-before-assignment
    "E1003",  # bad-super-call
    "E1111",  # assignment-from-no-return
    "E1120",  # no-value-for-parameter
    "E1121",  # too-many-function-args
    "E1126",  # invalid-sequence-index
    "E1128",  # assignment-from-none
    "E1136",  # unsubscriptable-object
    "E1137",  # unsupported-assignment-operation
    "E1307",  # bad-string-format-type
    "R0401",  # cyclic-import
    "R1704",  # redefined-argument-from-local
    "R1705",  # no-else-return, RET505 reports fewer cases
    "R1710",  # inconsistent-return-statements
    "R1712",  # consider-swap-variables
    "R1713",  # consider-using-join
    "R1714",  # consider-using-in, PLR1714 reports fewer cases
    "R1715",  # consider-using-get, SIM401 reports fewer cases
    "R1724",  # no-else-continue, RET507 reports fewer cases
    "R1727",  # condition-evals-to-constant
    "R1732",  # consider-using-with
    "R1733",  # unnecessary-dict-index-lookup, PLR1733 reports fewer cases
    "R1735",  # use-dict-literal, C408 reports fewer cases
    "W0101",  # unreachable
    "W0102",  # dangerous-default-value
    "W0104",  # pointless-statement, B018 reports fewer cases
    "W0106",  # expression-not-assigned
    "W0108",  # unnecessary-lambda
    "W0123",  # eval-used
    "W0125",  # using-constant-test
    "W0201",  # attribute-defined-outside-init
    "W0212",  # protected-access
    "W0221",  # arguments-differ
    "W0222",  # signature-differs
    "W0223",  # abstract-method
    "W0237",  # arguments-renamed
    "W0401",  # wildcard-import
    "W0404",  # reimported
    "W0601",  # global-variable-undefined
    "W0602",  # global-variable-not-assigned
    "W0603",  # global-statement
    "W0604",  # global-at-module-level
    "W0612",  # unused-variable, F841 skips unpacked variables (RUF059 is ignored)
    "W0613",  # unused-argument
    "W0621",  # redefined-outer-name
    "W0622",  # redefined-builtin
    "W0631",  # undefined-loop-variable
    "W0640",  # cell-var-from-loop
    "W0641",  # possibly-unused-variable
    "W0702",  # bare-except
    "W0716",  # wrong-exception-operation
    "W0718",  # broad-exception-caught
    "W0719",  # broad-exception-raised
    "W1113",  # keyword-arg-before-vararg
    "W1114",  # arguments-out-of-order
    "W1308",  # duplicate-string-formatting-argument
    "W1503",  # redundant-unittest-assert
    "W1508",  # invalid-envvar-default
    "W1510",  # subprocess-run-check
    "W1514",  # unspecified-encoding
    "W4701",  # modified-iterating-list
]

# Disabled by default.
enable = ["deprecated-pragma"]


[tool.pylint.variables]
# The translation function "_" is installed as a builtin by the grass package.
# *GRASS TODO: Find another pattern for translation that allows to use _ as a discard variable and other*
additional-builtins = ["_"]


[tool.pyright]
exclude = ["**/__pycache__", "**/OBJ.*", "bin.*/**", "dist.*/**"]
include = ["python"]

# Set extraPath to the output of $(grass --config python_path)

# *GRASS modified*
# *GRASS TODO: keep in sync with MIN_PYTHON_VERSION supported*
pythonVersion = "3.11"

[tool.pyrefact]
line_length = 88

[tool.isort]
profile = "black"
# *GRASS TODO: keep in sync with MIN_PYTHON_VERSION supported*
py_version = 311
